    name: Symfony in practice
    category: books
    price: 29.9
    active: true
  - sku: BK-0002
    name: Domain-driven design distilled
    category: books
    price: 34.5
    active: true
  - sku: GM-0001
    name: Cooperative city builder
    category: games
    price: 42
    active: true
  - sku: ST-0001
    name: Dotted notebook A5
    category: stationery
