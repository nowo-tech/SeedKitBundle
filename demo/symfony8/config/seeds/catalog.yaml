# Demo seed file (multi-document YAML): categories first, then the products that reference them.
#   bin/console seed:diff  config/seeds/catalog.yaml --actor=admin
#   bin/console seed:apply config/seeds/catalog.yaml --yes --actor=admin
provider: catalog.categories
version: 1
scope: platform
items:
  - slug: books
    label: Books
    description: Printed and digital books
  - slug: games
    label: Board games
  - slug: stationery
    label: Stationery
    description: Notebooks, pens and paper
---
provider: catalog.products
version: 1
scope: platform
items:
