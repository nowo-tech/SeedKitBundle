# Demo only: two in-memory users (password "demo", plaintext) and the form login of the demo. The bundle's role-based
# checker lets ROLE_ADMIN export / apply (the viewer, ROLE_USER, is refused by the guard).
security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext
    providers:
        demo_users:
            memory:
                users:
                    admin:  { password: demo, roles: [ROLE_USER, ROLE_ADMIN] }
                    viewer: { password: demo, roles: [ROLE_USER] }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|bundles)/
            security: false
        main:
            lazy: true
            provider: demo_users
            form_login:
                login_path: demo_login
                check_path: demo_login
                default_target_path: demo_home
                enable_csrf: true
            logout:
                path: demo_logout
                target: demo_home
    access_control:
        - { path: '^/seed(/|$)', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/', roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser: plaintext
