# Demo configuration: the defaults of the bundle (platform scope only, role-based access, run history in the default
# entity manager's connection). Demo-specific: the console may read the seed files of this demo (config/seeds),
# ROLE_ADMIN may prune (the bundle default is "nobody", Q-SK-13), and the opt-in UI (0.2) is mounted at /seeds inside
# the demo shell (ui.layout = the demo's base layout, so the pages need no template override).
nowo_seed_kit:
    console:
        allowed_dirs:
            - '%kernel.project_dir%/config/seeds'
            - '%kernel.project_dir%/var/seeds'
    security:
        prune_roles: ['ROLE_ADMIN']
    ui:
        enabled: true
        layout: base.html.twig
        max_upload_bytes: 2097152
        mounts:
            platform: { path: /seeds }
