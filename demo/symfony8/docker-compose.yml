name: seed-kit-bundle-demo-symfony-8
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seed-kit-demo-symfony8-php
    working_dir: /app
    restart: unless-stopped
    ports:
      # Loopback only (REQ-DEMO-005).
      - "127.0.0.1:${PORT:-8271}:80"
    volumes:
      - .:/app
      - ../..:/var/seed-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      # Demo database: the credentials of the private Compose network (demo only, nothing published).
      - DATABASE_URL=${DATABASE_URL:-mysql://app:app@db:3306/app?serverVersion=8.4&charset=utf8mb4}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seed-kit-demo-network
  db:
    image: mysql:8.4
    container_name: seed-kit-demo-symfony8-db
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - seed-kit-demo-network

volumes:
  composer-cache:
  db_data:

networks:
  seed-kit-demo-network:
    driver: bridge
