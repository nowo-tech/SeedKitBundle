# NowoSeedKitBundle translations (ca): error codes, reader reasons and row rules (keys are flat dot paths).
seed_kit:
  error:
    SEED_001: El proveïdor de seeds no està registrat o no està disponible per a aquest tipus d'àmbit.
    SEED_002: No es pot llegir el document de seeds.
    SEED_003: El document de seeds no és vàlid; no s'ha escrit res.
    SEED_004: Un camp secret conté un valor en clar o una referència que no es pot fer servir aquí; només s'accepten referències vault.
    SEED_005: Les dades han canviat des del pla revisat; revisa el nou diff i torna a aplicar.
    SEED_006: Una fila ha canviat mentre s'aplicava el pla; els lots ja aplicats es mantenen. Torna a aplicar el document.
    SEED_007: El tipus d'àmbit del document no coincideix amb l'àmbit de destinació.
    SEED_010: El proveïdor ha fallat en aplicar un lot; els lots ja aplicats es mantenen.
    SEED_011: Un proveïdor de seeds ha incomplert el seu contracte; el bundle no ha escrit res.
    SEED_012: Una protecció d'esborrat ha rebutjat el pla; confirma-ho explícitament.
    ACCESS_001: L'àmbit no existeix o no és visible.
    ACCESS_002: Accés denegat.
    CONFLICT_001: La base de dades ha continuat rebutjant l'escriptura per un conflicte de bloqueig; no s'ha escrit res. Torna-ho a provar més tard.
    CONFLICT_002: La base de dades ha continuat rebutjant l'escriptura per un conflicte de bloqueig; part de l'execució s'ha aplicat. Torna a aplicar el document.
