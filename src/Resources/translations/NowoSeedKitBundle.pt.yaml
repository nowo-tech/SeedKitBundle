# NowoSeedKitBundle translations (pt): error codes, reader reasons and row rules (keys are flat dot paths).
seed_kit:
  error:
    SEED_001: O fornecedor de seeds não está registado ou não está disponível para este tipo de âmbito.
    SEED_002: Não é possível ler o documento de seeds.
    SEED_003: O documento de seeds é inválido; nada foi escrito.
    SEED_004: Um campo secreto contém um valor em claro ou uma referência que não pode ser usada aqui; só são aceites referências vault.
    SEED_005: Os dados mudaram desde o plano revisto; reveja o novo diff e aplique de novo.
    SEED_006: Uma linha mudou enquanto o plano era aplicado; os lotes já aplicados mantêm-se. Aplique o documento de novo.
    SEED_007: O tipo de âmbito do documento não corresponde ao âmbito de destino.
    SEED_008: A execução de seeds não está disponível; não existe, não é sua ou o documento expirou.
    SEED_009: O plano é demasiado grande para ser aplicado num pedido web; aplique o ficheiro a partir da consola.
    SEED_010: O fornecedor falhou ao aplicar um lote; os lotes já aplicados mantêm-se.
    SEED_011: Um fornecedor de seeds violou o seu contrato; o bundle não escreveu nada.
    SEED_012: Uma proteção de eliminação recusou o plano; confirme-o explicitamente.
    ACCESS_001: O âmbito não existe ou não é visível.
    ACCESS_002: Acesso negado.
    CONFLICT_001: A base de dados continuou a recusar a escrita devido a um conflito de bloqueio; nada foi escrito. Tente mais tarde.
    CONFLICT_002: A base de dados continuou a recusar a escrita devido a um conflito de bloqueio; parte da execução foi aplicada. Aplique o documento de novo.
