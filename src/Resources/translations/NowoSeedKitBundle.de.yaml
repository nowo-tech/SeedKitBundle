# NowoSeedKitBundle translations (de): error codes, reader reasons and row rules (keys are flat dot paths).
seed_kit:
  error:
    SEED_001: Der Seed-Provider ist nicht registriert oder für diese Bereichsart nicht verfügbar.
    SEED_002: Das Seed-Dokument kann nicht gelesen werden.
    SEED_003: Das Seed-Dokument ist ungültig; es wurde nichts geschrieben.
    SEED_004: Ein geheimes Feld enthält einen Klartextwert oder eine hier nicht nutzbare Referenz; nur Vault-Referenzen sind erlaubt.
    SEED_005: Die Daten haben sich seit dem geprüften Plan geändert; prüfen Sie den neuen Diff und wenden Sie erneut an.
    SEED_006: Eine Zeile hat sich während der Anwendung geändert; bereits angewendete Batches bleiben. Wenden Sie das Dokument erneut an.
    SEED_007: Die Bereichsart des Dokuments passt nicht zum Zielbereich.
    SEED_008: Der Seed-Lauf ist nicht verfügbar; er existiert nicht, gehört nicht dir oder sein Dokument ist abgelaufen.
    SEED_009: Der Plan ist zu groß, um in einer Web-Anfrage angewendet zu werden; wende die Datei über die Konsole an.
    SEED_010: Der Provider konnte einen Batch nicht anwenden; bereits angewendete Batches bleiben.
    SEED_011: Ein Seed-Provider hat seinen Vertrag verletzt; das Bundle hat nichts geschrieben.
    SEED_012: Ein Löschschutz hat den Plan abgelehnt; bestätigen Sie ihn ausdrücklich.
    ACCESS_001: Der Bereich existiert nicht oder ist nicht sichtbar.
    ACCESS_002: Zugriff verweigert.
    CONFLICT_001: Die Datenbank lehnte das Schreiben wegen eines Sperrkonflikts weiter ab; es wurde nichts geschrieben. Später erneut versuchen.
    CONFLICT_002: Die Datenbank lehnte das Schreiben wegen eines Sperrkonflikts weiter ab; ein Teil des Laufs wurde angewendet. Wenden Sie das Dokument erneut an.
